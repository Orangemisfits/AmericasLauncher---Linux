name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The tag (e.g. v1.7.0) is the single source of truth for the version shown in the app.
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v', 'V')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore dependencies
        run: dotnet restore src/AmericasLauncher/AmericasLauncher.csproj

      - name: Publish (self-contained, single-file)
        run: >
          dotnet publish src/AmericasLauncher/AmericasLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Zip output
        run: Compress-Archive -Path publish\* -DestinationPath AmericasLauncher-${{ github.ref_name }}-win-x64.zip

      # These notes are also what the launcher shows in its "Updated to ..." popup.
      - name: Prepare release notes
        shell: pwsh
        run: |
          $file = "release-notes/${{ github.ref_name }}.md"
          if (Test-Path $file) {
            Copy-Item $file notes.md
          } else {
            "See the README for installation instructions: https://github.com/${{ github.repository }}#readme" | Out-File notes.md -Encoding utf8
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Americas Launcher ${{ github.ref_name }}
          body_path: notes.md
          files: AmericasLauncher-${{ github.ref_name }}-win-x64.zip
          draft: false
          prerelease: false

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore src/AmericasLauncher.Linux/AmericasLauncher.Linux.csproj

      - name: Publish (self-contained, linux-x64)
        run: |
          dotnet publish src/AmericasLauncher.Linux/AmericasLauncher.Linux.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -o publish-linux

      - name: Zip Linux output
        run: cd publish-linux && zip -r ../AmericasLauncher-${{ github.ref_name }}-linux-x64.zip .

      - name: Upload Linux artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: AmericasLauncher-${{ github.ref_name }}-linux-x64.zip
