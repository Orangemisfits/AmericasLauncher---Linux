name: Linux Test Build

on:
  push:
    branches:
      - Lunix-test
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Linux x64
        run: dotnet publish src/AmericasLauncher.Linux/AmericasLauncher.Linux.csproj -c Release -r linux-x64 --self-contained true -o publish-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmericasLauncher-linux-x64
          path: publish-linux/
          if-no-files-found: error
